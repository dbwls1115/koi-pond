<title>달밤 잉어 연못</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* layout: the garden pond fills the screen; dark glass controls sit on the water like smooth river stones */
:root {
  --glass: rgba(10, 34, 27, 0.6);
  --glass-strong: rgba(9, 30, 24, 0.9);
  --cream: #f1ead9;
  --muted: #a7b1ab;
  --line: rgba(241, 234, 217, 0.14);
  --maple: #cf5530;
  --maple-deep: #a8401f;
  --moss: #9bb865;
  --gold: #e0b24f;
  --display: 'Gowun Batang', 'Nanum Myeongjo', 'AppleMyungjo', serif;
  --body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; background: #0d3a2e; color: var(--cream); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

#water, #scene { position: fixed; z-index: 0; inset: 0; width: 100vw; height: 100vh; display: block; }
#water { background: radial-gradient(ellipse at 50% 50%, #1f6b52, #0c3a2d 75%); }
#paper { position: fixed; inset: 0; z-index: 2; pointer-events: none; mix-blend-mode: multiply; opacity: 0.35; background-repeat: repeat, no-repeat; background-size: 220px 220px, 100% 100%; }
#scene { z-index: 1; touch-action: none; cursor: crosshair; -webkit-tap-highlight-color: transparent; }
#scene.over-koi { cursor: pointer; }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid rgba(241, 234, 217, 0.16);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.family {
  position: fixed; z-index: 8;
  top: calc(14px + env(safe-area-inset-top, 0px));
  left: calc(14px + env(safe-area-inset-left, 0px));
  width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center;
  transition: transform .15s, background .15s;
}
.menu-item { transition: transform .22s cubic-bezier(.2, .8, .2, 1), opacity .18s, background .15s, visibility 0s; }
body:not(.menu-open) .menu-item { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-14px) scale(0.9); transition: transform .18s, opacity .15s, visibility 0s .18s; }
.family.fam { top: calc(78px + env(safe-area-inset-top, 0px)); transition-delay: 0s; }
.family.add { top: calc(142px + env(safe-area-inset-top, 0px)); }
.menu-open .family.add { transition-delay: .03s; }
.menu-open .family.snd { transition-delay: .06s; }
.menu-open .family.tch { transition-delay: .09s; }
.lbl {
  position: absolute; left: 64px; top: 50%; transform: translateY(-50%);
  padding: 5px 11px; border-radius: 999px;
  background: rgba(9, 30, 24, 0.82); color: var(--cream);
  font-size: 13px; white-space: nowrap; pointer-events: none;
}
.menu .bars { transition: transform .22s, opacity .18s; transform-origin: center; }
.menu-open .menu .b1 { transform: translateY(5px) rotate(45deg); }
.menu-open .menu .b2 { opacity: 0; }
.menu-open .menu .b3 { transform: translateY(-5px) rotate(-45deg); }
.family.add svg { width: 24px; height: 24px; }
.family.snd { top: calc(206px + env(safe-area-inset-top, 0px)); }
.family.snd svg { width: 24px; height: 24px; }
.family.tch { top: calc(270px + env(safe-area-inset-top, 0px)); }
.family.tch svg { width: 24px; height: 24px; }
.family.tch[aria-pressed="false"] { color: var(--muted); }
.family.tch .slash { opacity: 0; transition: opacity .2s; }
.family.tch[aria-pressed="false"] .slash { opacity: 1; }
.family.snd[aria-pressed="false"] { color: var(--muted); }
.family.snd .wave { transition: opacity .2s; }
.family.snd[aria-pressed="false"] .wave { opacity: 0; }
.family.snd .slash { opacity: 0; transition: opacity .2s; }
.family.snd[aria-pressed="false"] .slash { opacity: 1; }
.family:hover { background: rgba(14, 20, 24, 0.75); }
.family:active { transform: scale(0.95); }
.family svg { width: 28px; height: 28px; }
.family[aria-expanded="true"] { background: var(--cream); color: #1a2226; }
.badge {
  position: absolute; top: -3px; right: -3px;
  min-width: 21px; height: 21px; padding: 0 5px; border-radius: 11px;
  background: var(--maple); color: #fff6ec;
  font-size: 12px; font-weight: 700; line-height: 21px; text-align: center;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 0 0 2px rgba(10, 16, 20, 0.6);
}

.hint {
  position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
  top: 50%; transform: translate(-50%, -50%);
  padding: 11px 22px; border-radius: 999px;
  background: rgba(8, 26, 20, 0.62); color: var(--cream); font-size: 16px;
  font-family: var(--display);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .9s;
  max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis;
}
.topstats {
  position: fixed; z-index: 8;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: calc(14px + env(safe-area-inset-right, 0px));
  height: 54px; padding: 0 4px; border-radius: 27px;
  display: flex; align-items: center;
}
.stat { display: flex; flex-direction: column; justify-content: center; padding: 0 16px; line-height: 1.2; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat small { font-size: 11px; color: var(--muted); letter-spacing: 0.02em; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.stat b { font-family: var(--display); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat b span { font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 2px; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #86e07c; box-shadow: 0 0 0 3px rgba(134, 224, 124, 0.22); animation: live 2s ease-in-out infinite; }
@keyframes live { 50% { box-shadow: 0 0 0 5px rgba(134, 224, 124, 0.08); } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
@media (max-width: 420px) { .stat { padding: 0 12px; } .stat b { font-size: 16px; } }
.toast {
  position: fixed; z-index: 9; left: 50%; transform: translate(-50%, -8px);
  top: calc(80px + env(safe-area-inset-top, 0px));
  padding: 9px 16px; border-radius: 14px; font-size: 14px;
  background: var(--glass-strong);
  opacity: 0; pointer-events: none; transition: opacity .35s, transform .35s;
  max-width: calc(100vw - 150px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast b { font-family: var(--display); color: var(--gold); }

.card {
  position: fixed; z-index: 7; left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: min(360px, calc(100vw - 24px));
  transform: translateX(-50%);
  padding: 14px 16px 16px; border-radius: 20px;
  background: var(--glass-strong);
  display: grid; gap: 8px;
}
.card[hidden] { display: none !important; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card canvas { width: 230px; height: 78px; max-width: 100%; }
.card .close { margin: -4px -6px 0 0; }
.card h3 { margin: 0; font-family: var(--display); font-size: 21px; line-height: 1.25; text-wrap: balance; }
.card h3.unnamed { color: var(--muted); font-weight: 400; font-size: 17px; }
.breed { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.tier { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; letter-spacing: 0.04em; }
.tier.t0 { color: var(--muted); }
.tier.t1 { color: var(--moss); }
.tier.t2 { color: var(--gold); }
.stat-line { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stat-line strong { color: var(--cream); font-weight: 400; }
.name-form { display: flex; gap: 8px; margin-top: 2px; }
.name-form input {
  flex: 1; min-width: 0; font: inherit; font-size: 15px; color: var(--cream);
  padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(241, 234, 217, 0.07);
}
.name-form input::placeholder { color: rgba(167, 177, 171, 0.8); }
.name-form input:focus { outline: 2px solid var(--gold); border-color: transparent; }
.name-form button, .primary-btn {
  padding: 9px 15px; border-radius: 12px; white-space: nowrap;
  background: var(--cream); color: #1a2226; font-weight: 700;
}
.name-form button:hover, .primary-btn:hover { background: #fff8e8; }
.primary-btn:disabled { opacity: .4; cursor: default; }
.err { font-size: 12.5px; color: #f0a07e; margin: 0; }
.close { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.close:hover { background: rgba(241, 234, 217, 0.1); color: var(--cream); }
.close svg { width: 17px; height: 17px; }

.drawer {
  position: fixed; z-index: 7;
  top: calc(80px + env(safe-area-inset-top, 0px));
  left: calc(12px + env(safe-area-inset-left, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  width: min(372px, calc(100vw - 24px));
  display: flex; flex-direction: column;
  background: var(--glass-strong); border-radius: 22px;
  transform: translateX(calc(-100% - 40px));
  transition: transform .38s cubic-bezier(.2, .8, .2, 1);
}
.drawer.open { transform: none; }
@media (max-width: 640px) {
  .drawer {
    top: auto; left: 8px; right: 8px; bottom: 0; width: auto;
    max-height: 78vh; border-radius: 22px 22px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transform: translateY(105%);
  }
}
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 6px 20px; }
.drawer-head h2 { font-family: var(--display); font-size: 20px; margin: 0; }
.drawer-head p { margin: 0; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0; padding: 0 10px; overflow-y: auto; flex: 1 1 auto; min-height: 110px; }
.row {
  display: grid; grid-template-columns: 78px minmax(0, 1fr) auto;
  gap: 1px 12px; align-items: center;
  padding: 9px 8px; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row canvas { width: 78px; height: 38px; grid-row: 1 / span 3; }
.row .name {
  font: inherit; font-family: var(--display); font-weight: 700; font-size: 16.5px; color: var(--cream);
  border: 0; background: transparent; border-radius: 7px;
  padding: 1px 6px; margin-left: -6px; width: 100%; min-width: 0;
}
.row .name::placeholder { color: var(--muted); font-weight: 400; font-family: var(--body); font-size: 14px; }
.row .name:hover { background: rgba(241, 234, 217, 0.07); }
.row .name:focus { outline: 2px solid var(--gold); background: rgba(241, 234, 217, 0.1); }
.meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta strong { color: var(--cream); font-weight: 400; }
.belly { height: 4px; border-radius: 2px; background: rgba(241, 234, 217, 0.12); overflow: hidden; margin-top: 3px; }
.belly i { display: block; height: 100%; background: var(--gold); border-radius: 2px; transition: width .5s; }
.row { cursor: pointer; border-radius: 12px; border-bottom-color: transparent; box-shadow: inset 0 -1px 0 var(--line); }
.row:hover { background: rgba(241, 234, 217, 0.05); }
.row.active { background: rgba(224, 178, 79, 0.14); box-shadow: inset 0 0 0 1.5px rgba(224, 178, 79, 0.7); }
.row:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.del {
  grid-column: 3; grid-row: 1 / span 3;
  min-width: 34px; height: 34px; padding: 0 8px; border-radius: 10px;
  display: grid; place-items: center; color: var(--muted);
  font-size: 12.5px; white-space: nowrap;
  transition: background .15s, color .15s;
}
.del svg { width: 17px; height: 17px; }
.del:hover { background: rgba(240, 160, 126, 0.14); color: #f0a07e; }
.del.arm { background: #c4512f; color: #fff6ec; padding: 0 11px; }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); font-size: 13.5px; }
.drawer-foot { padding: 12px 18px 16px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.adopt-note { font-size: 12px; color: var(--muted); margin: 0; }
.reset { justify-self: start; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 2px 0; }
.reset.arm { color: #f0a07e; }
.family:disabled { opacity: .45; cursor: default; }

@media (prefers-reduced-motion: reduce) { .drawer, .toast { transition: none; } }
</style>
</head>
<body>

<canvas id="water" aria-hidden="true"></canvas>
<div id="paper" aria-hidden="true"></div>
<canvas id="scene" role="img" aria-label="정원 연못. 물을 누르면 먹이를 주고, 잉어를 누르면 이름을 지어 줄 수 있습니다."></canvas>

<button class="family menu glass" id="menuBtn" aria-expanded="false" aria-label="메뉴 열기">
  <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
    <path class="bars b1" d="M7 9h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path class="bars b2" d="M7 14h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path class="bars b3" d="M7 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>

<button class="family fam menu-item glass" id="familyBtn" aria-expanded="false" aria-controls="drawer" aria-label="연못 식구 보기">
  <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
    <path d="M3.5 14c3-4 6.6-5.8 10.4-5.8 3 0 5.4 1.2 7.3 3.2L25 8.6v10.8l-3.8-2.8c-1.9 2-4.3 3.2-7.3 3.2C10.1 19.8 6.5 18 3.5 14Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M12 9.2c-.8 1.4-1 3-.2 4.4M15.5 10c.6 1.8 0 3.6-1.5 4.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
    <circle cx="8.3" cy="13.2" r="1.15" fill="currentColor"/>
  </svg>
  <span class="badge" id="countN">6</span>
  <span class="lbl">연못 식구</span>
</button>

<button class="family snd menu-item glass" id="soundBtn" aria-pressed="true" aria-label="물소리 끄기">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4v-5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    <path class="wave" d="M15.5 9.2c.9.8 1.4 1.8 1.4 2.8s-.5 2-1.4 2.8M18 6.8c1.6 1.4 2.5 3.2 2.5 5.2s-.9 3.8-2.5 5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </svg>
  <span class="lbl" id="soundLbl">물소리 켜짐</span>
</button>

<button class="family tch menu-item glass" id="touchBtn" aria-pressed="true" aria-label="잉어 터치 끄기">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M9.5 11V5.2a1.5 1.5 0 0 1 3 0V10m0-.6a1.5 1.5 0 0 1 3 0v1.2m0-.4a1.5 1.5 0 0 1 3 0v4.2c0 3.3-2.3 5.6-5.4 5.6-2.2 0-3.6-1-4.8-2.8L5.6 14a1.5 1.5 0 0 1 2.5-1.6l1.4 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
  <span class="lbl" id="touchLbl">잉어 터치 켜짐</span>
</button>

<div class="topstats glass" aria-label="연못 현황">
  <div class="stat"><small id="foodLbl">준 먹이</small><b><em id="foodN" style="font-style:normal">0</em><span>알</span></b></div>
  <div class="stat" id="liveStat" hidden><small><i class="live-dot"></i>지금 보는 중</small><b><em id="liveN" style="font-style:normal">1</em><span>명</span></b></div>
</div>

<div class="hint" id="hint">연못을 클릭해서 잉어에게 밥을 주세요</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<button class="family add menu-item glass" id="newBtn" aria-label="새 잉어 들이기">
  <svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M14 6.5v15M6.5 14h15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <span class="lbl">새 잉어</span>
</button>

<div class="card glass" id="card" hidden role="dialog" aria-labelledby="cardName">
  <div class="card-top">
    <canvas id="cardPortrait" aria-hidden="true"></canvas>
    <button class="close" id="cardClose" aria-label="닫기"><svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </div>
  <h3 id="cardName">이름 없는 잉어</h3>
  <div class="breed" id="cardBreed"></div>
  <div class="stat-line" id="cardStats"></div>
  <form class="name-form" id="nameForm" autocomplete="off">
    <input id="nameInput" maxlength="10" placeholder="이름을 지어 주세요" aria-label="잉어 이름">
    <button type="submit" id="nameBtn">이름 짓기</button>
  </form>
  <p class="err" id="nameErr" hidden>이름을 한 글자 이상 적어 주세요.</p>
</div>

<aside class="drawer glass" id="drawer" aria-label="연못 식구" inert>
  <div class="drawer-head">
    <div>
      <h2>연못 식구</h2>
      <p id="stats">잉어 6마리 · 뿌린 먹이 0알</p>
    </div>
    <button class="close" id="drawerClose" aria-label="닫기"><svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </div>
  <ul class="list" id="list"></ul>

    { name: '아사기', w: 6, tier: 1, make: g => { g.base = C.blue; g.net = '#3b4d66'; g.spots.push({ s: 0.5, o: 0, r: 0.85, c: '#cbd6de', e: 0.9, rot: 0 }); sides(g, '#dc6a35'); g.fin = '#e08a55'; } },
    { name: '슈스이', w: 4, tier: 1, make: g => { g.base = '#8ea6ba'; g.doitsu = '#2c3a4f'; sides(g, '#d9602f', 2); g.fin = '#e08a55'; if (Math.random() < 0.25) { g.label = '히 슈스이'; sides(g, '#d9602f', 3); hiPattern(g, '#d65a2c'); } } },

    { name: '베니 키코쿠류', w: 2, tier: 2, make: g => { g.base = '#dfe3e6'; g.metal = true; g.doitsu = C.black; hiSparse(g, C.red); sumi(g, 4 + rnd(3), 1, 10, 0.3, 0.55); g.finBase = C.black; } },

  function makeGenome() {

  // ================= state =================
  let padObs = [], lilies = [], sprigs = [], weeds = [];

  let given = 0, eatenTotal = 0, showTags = true;
  const cm = k => Math.round(k.size * 26);

        .map(s => makeKoi(s.g, clamp(+s.size || 1, 0.5, MAX_SIZE), { ...s, name: String(s.name || '').slice(0, 10) }));

  // ================= reflection texture (painted once per size) =================

    { c: '#1c3a1f', w: 3 }, { c: '#2e5a27', w: 3 }, { c: '#4c7d2c', w: 2.2 }, { c: '#93b13d', w: 1.1 },

  ];
  function wcBlob(g, x, y, r, col, a, edge = 2.2) {
    const n = 26, ph = rand(0, TAU), ph2 = rand(0, TAU), pts = [];
    for (let i = 0; i < n; i++) {
      const an = i / n * TAU, m = 1 + 0.2 * Math.sin(3 * an + ph) + 0.1 * Math.sin(5 * an + ph2) + rand(-0.07, 0.07);
      pts.push({ x: x + Math.cos(an) * r * m, y: y + Math.sin(an) * r * m * rand(0.8, 1) });
    }
    g.beginPath();
    const m0 = mid(pts[n - 1], pts[0]); g.moveTo(m0.x, m0.y);
    for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n], mm = mid(p, q); g.quadraticCurveTo(p.x, p.y, mm.x, mm.y); }
    g.closePath();
    g.fillStyle = `rgba(${col},${a})`; g.fill();
    g.strokeStyle = `rgba(${col},${Math.min(1, a * edge)})`; g.lineWidth = 0.8 + r * 0.012; g.stroke();
  }
  function buildReflection() {
    const rs = 0.6;
    const c = document.createElement('canvas');
    c.width = Math.max(64, Math.round(W * rs)); c.height = Math.max(64, Math.round(H * rs));
    const g = c.getContext('2d');
    g.scale(rs, rs);
    const R = Math.hypot(W, H) / 2;
    const base = g.createRadialGradient(W * 0.48, H * 0.45, 0, W * 0.5, H * 0.5, R);
    base.addColorStop(0, '#22765a'); base.addColorStop(0.45, '#17604a'); base.addColorStop(1, '#0a3326');
    g.fillStyle = base; g.fillRect(0, 0, W, H);
    const u = Math.min(W, H);
    // broad, soft shadows of deeper water: smooth shapes stacked so their edges fade out
    const shape = (x, y, r, col, a) => {
      const n = 22, ph = rand(0, TAU), ph2 = rand(0, TAU), stretch = rand(0.6, 1.1), rot = rand(0, TAU);
      for (let k = 0; k < 6; k++) {
        const f = 1 - k * 0.12;
        g.beginPath();
        for (let i = 0; i <= n; i++) {
          const an = i / n * TAU, m = r * f * (1 + 0.22 * Math.sin(2 * an + ph) + 0.12 * Math.sin(3 * an + ph2));
          const px = Math.cos(an) * m, py = Math.sin(an) * m * stretch;
          const X = x + px * Math.cos(rot) - py * Math.sin(rot), Y = y + px * Math.sin(rot) + py * Math.cos(rot);

      }
      g.putImageData(img, 0, 0);
      g.strokeStyle = 'rgba(150, 140, 120, 0.12)'; g.lineWidth = 0.6;
      for (let i = 0; i < 40; i++) { const x = rand(0, 220), y = rand(0, 220), a = rand(0, TAU), l = rand(6, 22); g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.5) * l * 0.5, y + Math.sin(a + 0.5) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }

  function initAmbient() {

      weeds.push({ x, y, r: rand(0.8, 2.6), c: ['#8fdc5c', '#6cc24a', '#b5ee7a', '#5aa83c'][rnd(4)], a: rand(0.55, 0.95) });
    }

  function flowAt(x, y, t) {
    return {
      x: (8 + Math.sin(y * 0.0047 + t * 0.21) * 6 + Math.sin(x * 0.0031 - t * 0.13 + 2) * 4 + Math.sin(t * 0.05) * 4) * scale,

  }

  // ================= koi behaviour =================
  function nearestPellet(k) {
    const h = k.seg[0];
    const reach = (k.full >= 10 ? 180 : 300 + (10 - k.full) * 50) * scale;
    let best = null, bd = reach;
    for (const p of pellets) {
      if (p.drop > 0 || p.gone) continue;
      const d = Math.hypot(p.x - h.x, p.y - h.y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }
  function updateKoi(k, dt, t) {
    const h = k.seg[0];
    const target = k.hold ? null : nearestPellet(k);
    let desired, speedGoal, turn;
    if (target) {
      desired = Math.atan2(target.y - h.y, target.x - h.x);
      speedGoal = (48 + (10 - k.full) * 6) * scale;
      turn = 3;
    } else {
      k.wanderT -= dt;
      if (k.wanderT <= 0) { k.wander = k.a + rand(-1.1, 1.1); k.wanderT = rand(1.5, 4); }
      desired = k.wander;
      speedGoal = k.hold ? 9 * scale : (22 + Math.sin(k.phase * 0.13) * 6) * scale;
      turn = k.hold ? 0.8 : 1.1;
    }
    const m = 60 * scale;
    if (h.x < m || h.x > W - m || h.y < m || h.y > H - m) {
      const toC = Math.atan2(H / 2 - h.y, W / 2 - h.x);
      const e = Math.max(m - h.x, h.x - (W - m), m - h.y, h.y - (H - m)) / m;
      desired += angDiff(desired, toC) * clamp(e, 0, 1);
      if (!target) { k.wander = toC; turn = 1.8; }
    }
    for (const r of rocks) {
      const rr = Math.max(r.rx, r.ry) * 0.95, mg = 50 * scale;
      const dx = h.x - r.x, dy = h.y - r.y, d = Math.hypot(dx, dy) || 1;
      if (d < rr + mg) {
        const away = Math.atan2(dy, dx);
        desired += angDiff(desired, away) * clamp((rr + mg - d) / mg, 0, 1) * 0.9;
        if (!target) { k.wander = away; turn = Math.max(turn, 1.8); }
        if (d < rr) { h.x = r.x + dx / d * rr; h.y = r.y + dy / d * rr; }
      }
    }
    for (const o of koi) {
      if (o === k) continue;
      const dx = h.x - o.seg[0].x, dy = h.y - o.seg[0].y, d = Math.hypot(dx, dy);
      if (d < 24 * scale && d > 0.01) desired += angDiff(desired, Math.atan2(dy, dx)) * 0.25;
    }
    k.a += clamp(angDiff(k.a, desired), -turn * dt, turn * dt);
    k.speed += (speedGoal - k.speed) * Math.min(1, dt * 1.6);
    k.phase += dt * (2.6 + k.speed * 0.07 / scale);
    const sway = Math.sin(k.phase) * 0.2;
    const fl = flowAt(h.x, h.y, t);
    h.x += Math.cos(k.a + sway) * k.speed * dt + fl.x * dt * 0.12;
    h.y += Math.sin(k.a + sway) * k.speed * dt + fl.y * dt * 0.12;

      const p = k.seg[j], q = k.seg[j - 1];
      const dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy) || 1;

    }
    if (target && Math.hypot(target.x - h.x, target.y - h.y) < 9 * scale * Math.sqrt(k.size)) {
      target.gone = true;
      k.full = Math.min(10, k.full + 0.8);
      k.eaten++; eatenTotal++; minePending++;
      k.size = Math.min(MAX_SIZE, k.size + 0.004 * (MAX_SIZE - k.size) / (MAX_SIZE - 0.55));
      k.gulp = 1;
      ripples.push({ x: target.x, y: target.y, t: 0, life: 0.8, r: 16 * scale, str: 0.3 });
      const now = Math.floor(cm(k) / 5) * 5;
      if (now > k.mile) {
        k.mile = now;
        const who = k.name ? `<b>${esc(k.name)}</b>${josa(k.name, '이', '가')}` : `이름 없는 ${esc(k.g.label)} 잉어가`;

      }

  // ================= koi drawing =================
  function drawKoi(c, k, sc, shadow, time) {
    const g = k.g, s = k.seg, mw = maxW(k, sc);
    const L = [], R = [], nrm = [], wid = [];
    for (let i = 0; i < N; i++) {
      let dx = i === 0 ? s[0].x - s[1].x : s[i - 1].x - s[i].x;
      let dy = i === 0 ? s[0].y - s[1].y : s[i - 1].y - s[i].y;
      const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
      const w = mw * PROFILE[i] * (i < 3 ? 1 + k.gulp * 0.07 : 1);
      nrm.push({ x: -dy, y: dx, dx, dy }); wid.push(w);
      L.push({ x: s[i].x - dy * w, y: s[i].y + dx * w });
      R.push({ x: s[i].x + dy * w, y: s[i].y - dx * w });
    }

      const n = pts.length, m0 = mid(pts[n - 1], pts[0]);

      c.closePath();
    };

    const back = { x: -tn.dx, y: -tn.dy };
    const fm = g.longFin ? 1.65 : 1;
    const tl = mw * 2.1 * fm;
    const flick = Math.sin(k.phase + 1.2) * 0.35;

    const finsAndTail = (fill, alpha, baseCol) => {
      c.save();
      c.globalAlpha = alpha; c.fillStyle = fill;
      const spread = 0.75 * (g.longFin ? 1.15 : 1);
      const tipA = { x: tail.x + back.x * tl + tn.x * tl * (spread + flick), y: tail.y + back.y * tl + tn.y * tl * (spread + flick) };
      const tipB = { x: tail.x + back.x * tl - tn.x * tl * (spread - flick), y: tail.y + back.y * tl - tn.y * tl * (spread - flick) };
      const notch = { x: tail.x + back.x * tl * 0.55, y: tail.y + back.y * tl * 0.55 };
      c.beginPath();
      c.moveTo(tail.x + tn.x * wid[N - 1], tail.y + tn.y * wid[N - 1]);
      c.quadraticCurveTo(tail.x + back.x * tl * 0.4 + tn.x * tl * 0.5, tail.y + back.y * tl * 0.4 + tn.y * tl * 0.5, tipA.x, tipA.y);

      c.quadraticCurveTo(notch.x - tn.x * tl * 0.15, notch.y - tn.y * tl * 0.15, tipB.x, tipB.y);
      c.quadraticCurveTo(tail.x + back.x * tl * 0.4 - tn.x * tl * 0.5, tail.y + back.y * tl * 0.4 - tn.y * tl * 0.5, tail.x - tn.x * wid[N - 1], tail.y - tn.y * wid[N - 1]);

      const fp = s[2], fn = nrm[2];
      const dirA = Math.atan2(fn.dy, fn.dx);
      const flap = Math.sin(k.phase * 0.6) * 0.35;
      for (const side of [1, -1]) {
        const fx = fp.x + fn.x * wid[2] * 0.85 * side - fn.dx * mw * 0.6 * fm;
        const fy = fp.y + fn.y * wid[2] * 0.85 * side - fn.dy * mw * 0.6 * fm;

          const bx = fx - Math.cos(rot) * mw * 0.55 * fm, by = fy - Math.sin(rot) * mw * 0.55 * fm;

    c.strokeStyle = 'rgba(10, 40, 30, 0.35)'; c.lineWidth = Math.max(0.8, mw * 0.08); c.stroke();

      const w = wid[i0], n = nrm[i0];

      c.fillStyle = sp.c;
      c.globalAlpha = 0.28;
      c.beginPath(); c.ellipse(ex, ey, rx * 1.22, ry * 1.25, rot, 0, TAU); c.fill();
      c.globalAlpha = 0.86;
      c.beginPath(); c.ellipse(ex, ey, rx, ry, rot, 0, TAU); c.fill();
      c.globalAlpha = 0.3; c.strokeStyle = 'rgba(40, 10, 5, 0.9)'; c.lineWidth = Math.max(0.6, mw * 0.06); c.stroke();

    if (g.net) {

        const n = nrm[i], dir = Math.atan2(n.dy, n.dx) + Math.PI;
        for (const l of [-0.75, -0.25, 0.25, 0.75]) {
          const off = (i % 2 ? 0.25 : 0) * (l > 0 ? -1 : 1);
          const px = s[i].x + n.x * (l + off * 0.5) * wid[i], py = s[i].y + n.y * (l + off * 0.5) * wid[i];

        const n = nrm[i];
        c.beginPath(); c.ellipse(s[i].x + n.x * 0.2 * side * wid[i], s[i].y + n.y * 0.2 * side * wid[i], mw * 0.17, mw * 0.13, Math.atan2(n.dy, n.dx), 0, TAU); c.fill();
      }

    }
    c.strokeStyle = 'rgba(20, 45, 32, 0.2)'; c.lineWidth = mw * 0.45; bodyPath(); c.stroke();
    const sheen = c.createLinearGradient(s[0].x, s[0].y, s[N - 1].x, s[N - 1].y);
    const shv = g.metal ? 0.5 : 0.15;

        c.fillStyle = `rgba(255, 255, 255, ${0.9 * tw})`;
        c.beginPath(); c.arc(s[i].x + n.x * 0.45 * side * wid[i], s[i].y + n.y * 0.45 * side * wid[i], Math.max(0.8, mw * 0.1), 0, TAU); c.fill();
      }
    }
    c.restore();

    c.fillStyle = 'rgba(10,10,12,0.85)';
    const n0 = nrm[0];
    for (const side of [1, -1]) {
      c.beginPath();
      c.arc(s[0].x + n0.dx * wid[0] * 0.35 + n0.x * wid[0] * 0.62 * side, s[0].y + n0.dy * wid[0] * 0.35 + n0.y * wid[0] * 0.62 * side, Math.max(1, mw * 0.13), 0, TAU);

    }
  }

  function paintPortrait(canvas, g, cssW, cssH) {
    const pr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(cssW * pr); canvas.height = Math.round(cssH * pr);
    const p = canvas.getContext('2d');
    p.setTransform(pr, 0, 0, pr, 0, 0);
    p.clearRect(0, 0, cssW, cssH);
    const fm = g.longFin ? 1.65 : 1;
    const sc = Math.min(cssW * 0.9 / (70 + 22 * fm + 6), cssH * 0.85 / (34 * (g.longFin ? 1.25 : 1)));
    const fake = { g, size: 1, gulp: 0, phase: 0.6, seg: [] };
    const gap = segGap(fake, sc);
    const len = (N - 1) * gap + 22 * fm * sc;
    const x0 = (cssW + len) / 2 - 4 * sc;
    for (let j = 0; j < N; j++) fake.seg.push({ x: x0 - j * gap, y: cssH / 2 + Math.sin(j * 0.42) * j * 0.18 * sc });
    drawKoi(p, fake, sc, false, 0);
  }

  // ================= food & ripples =================
  function addPellet(x, y, spread) {
    const a = rand(0, TAU), r = rand(0, spread);
    const px = clamp(x + Math.cos(a) * r, 6, W - 6), py = clamp(y + Math.sin(a) * r, 6, H - 6);
    if (inRock(px, py, 4)) return;
    if (pellets.length >= MAX_PELLETS) pellets.shift();
    pellets.push({ x: px, y: py, drop: rand(0.15, 0.32), age: 0, hue: rand(22, 34), bob: rand(0, TAU) });
    given++;
  }
  let plop = () => {};
  function handful(x, y, n) {
    plop();
    for (let i = 0; i < n; i++) addPellet(x, y, 18 * scale);
    ripples.push({ x, y, t: 0, life: 1.6, r: 46 * scale, str: 1 });
    ripples.push({ x, y, t: -0.25, life: 1.6, r: 30 * scale, str: 0 });
    fed();
  }
  let pourCount = 0;
  function pour(x, y) {
    addPellet(x, y, 12 * scale);
    if (Math.random() < 0.5) addPellet(x, y, 12 * scale);
    if (pourCount++ % 3 === 0) { ripples.push({ x, y, t: 0, life: 1.2, r: 26 * scale, str: 0.45 }); plop(); }
    fed();
  }
  function fed() { hideHint(); uiDirty = true; saveDirty = true; if (ripples.length > 90) ripples.splice(0, ripples.length - 90); }

  function drawPellets(dt, t) {
    for (const p of pellets) {
      p.age += dt;
      if (p.drop > 0) p.drop -= dt;
      const fl = flowAt(p.x, p.y, t);
      const m = p.age < 35 ? 0.6 : 0.2;
      p.x += fl.x * dt * m; p.y += fl.y * dt * m;
      if (inRock(p.x, p.y)) { p.x -= fl.x * dt * m; p.y -= fl.y * dt * m; }
      const sink = clamp((p.age - 35) / 10, 0, 1);
      if (sink >= 1 || p.x > W + 10 || p.y > H + 10) { p.gone = true; continue; }
      const lift = p.drop > 0 ? p.drop * 2.4 : 0;
      const r = 4.8 * Math.max(scale, 0.8) * (1 + lift) * (1 - sink * 0.4);
      const bx = p.x + Math.sin(t * 1.3 + p.bob) * 0.7, by = p.y + Math.cos(t * 1.1 + p.bob) * 0.7;
      ctx.globalAlpha = 1 - sink;
      ctx.fillStyle = 'rgba(0,4,14,0.35)';
      ctx.beginPath(); ctx.arc(bx + 2.5, by + 3.4, r, 0, TAU); ctx.fill();
      ctx.fillStyle = `hsl(${p.hue}, 64%, ${50 - sink * 16}%)`;
      ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,232,196,0.6)';
      ctx.beginPath(); ctx.arc(bx - r * 0.35, by - r * 0.35, r * 0.36, 0, TAU); ctx.fill();

      fdb.ref('.info/connected').on('value', snap => {
        if (snap.val() !== true) return;
        me.onDisconnect().remove().then(() => me.set(true)).catch(() => {});
      });
      fdb.ref('presence').on('value', snap => {
        const n = snap.numChildren();
        $('liveStat').hidden = n < 1;
        $('liveN').textContent = n.toLocaleString('ko-KR');
      });
    } catch (e) { console.warn('Firebase를 불러오지 못했어요', e); }
  }
  initFirebase();

  // ---- ambient water sound (starts with the first touch; browsers block sound before that) ----
  let soundOn = true, ac = null, master = null, dripTimer = 0;
  try { soundOn = localStorage.getItem('koi-sound') !== 'off'; } catch (e) {}
  const soundBtn = $('soundBtn');
  function syncSound() {
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    soundBtn.setAttribute('aria-label', soundOn ? '물소리 끄기' : '물소리 켜기');
    $('soundLbl').textContent = soundOn ? '물소리 켜짐' : '물소리 꺼짐';
  }
  syncSound();
  function noiseBuffer(sec, brown) {
    const len = Math.floor(ac.sampleRate * sec), buf = ac.createBuffer(2, len, ac.sampleRate);
    const fade = Math.floor(ac.sampleRate * 0.25);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
      }
      // blend the tail into the head so the loop has no seam
      for (let i = 0; i < fade; i++) { const t = i / fade; d[i] = d[i] * t + d[len - fade + i] * (1 - t); }
    }
    return buf;
  }
  function startAudio() {
    if (ac || !soundOn) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
      // running water = a soft low wash plus a dense spray of tiny filtered noise grains
      whiteBuf = noiseBuffer(3, false);
      const bed = ac.createBufferSource(); bed.buffer = noiseBuffer(8, true); bed.loop = true;
      const bedLp = ac.createBiquadFilter(); bedLp.type = 'lowpass'; bedLp.frequency.value = 650; bedLp.Q.value = 0.3;
      const bedG = ac.createGain(); bedG.gain.value = 0.22;
      bed.connect(bedLp); bedLp.connect(bedG); bedG.connect(master);
      bed.start();
      const wash = ac.createBufferSource(); wash.buffer = whiteBuf; wash.loop = true;
      const washBp = ac.createBiquadFilter(); washBp.type = 'bandpass'; washBp.frequency.value = 900; washBp.Q.value = 0.5;
      const washG = ac.createGain(); washG.gain.value = 0.045;
      wash.connect(washBp); washBp.connect(washG); washG.connect(master);
      wash.start();
      grainBus = ac.createGain(); grainBus.gain.value = 1;
      const grainLp = ac.createBiquadFilter(); grainLp.type = 'lowpass'; grainLp.frequency.value = 2600;
      grainBus.connect(grainLp); grainLp.connect(master);
      nextGrain = ac.currentTime + 0.05;
      master.gain.setTargetAtTime(0.5, ac.currentTime, 0.8);
      scheduleDrip();
    } catch (e) { ac = null; }
  }
  function blip(freq0, freq1, vol, dur) {
    if (!ac || !soundOn) return;
    if (ac.state === 'suspended') ac.resume().catch(() => {});
    const t = ac.currentTime + 0.01;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq0, t);
    o.frequency.exponentialRampToValueAtTime(freq1, t + dur * 0.45);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  let whiteBuf = null, grainBus = null, nextGrain = 0, nextBubble = 0, gush = 1, gushT = 0;
  // one tiny air bubble popping under running water: a sine that glides upward and dies fast
  function bubble(t, f0, vol, dur) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * rand(1.6, 2.6), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(grainBus);
    o.start(t); o.stop(t + dur + 0.01);
  }
  function grain(t, freq, q, vol, dur) {
    const src = ac.createBufferSource(); src.buffer = whiteBuf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.012, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g); g.connect(grainBus);
    src.start(t, rand(0, 2.5), dur + 0.02);
  }
  function scheduleDrip() {
    clearTimeout(dripTimer);
    const tick = () => {
      if (ac && soundOn && ac.state === 'running' && grainBus) {
        const ahead = ac.currentTime + 0.15;
        if (nextGrain < ac.currentTime) nextGrain = ac.currentTime + 0.01;
        // the stream surges and eases every few seconds
        gushT -= 0.06;
        if (gushT <= 0) { gush = rand(0.55, 1.25); gushT = rand(1.5, 4); }
        while (nextGrain < ahead) {
          const f = Math.exp(rand(Math.log(400), Math.log(3000)));
          grain(nextGrain, f, rand(0.8, 2), rand(0.025, 0.06) * gush * (f > 1800 ? 0.6 : 1), rand(0.03, 0.08));
          nextGrain += rand(0.012, 0.04);
        }
        if (nextBubble < ac.currentTime) nextBubble = ac.currentTime + 0.01;
        while (nextBubble < ahead) {
          // babble: many small, quick bubbles low in pitch, often in little runs
          const run = Math.random() < 0.3 ? 2 + rnd(3) : 1;
          let bt = nextBubble;
          const base = Math.exp(rand(Math.log(260), Math.log(1100)));
          for (let i = 0; i < run; i++) {
            bubble(bt, base * rand(0.85, 1.2), rand(0.025, 0.07) * gush, rand(0.018, 0.05));
            bt += rand(0.02, 0.05);
          }
          nextBubble += rand(0.025, 0.09) / gush;
        }
      }
      dripTimer = setTimeout(tick, 60);
    };
    tick();
  }
  plop = () => {
    if (!ac || !soundOn || !whiteBuf) return;
    blip(rand(160, 220), rand(520, 700), 0.22, 0.09);
    grain(ac.currentTime + 0.012, rand(1200, 1800), 1.2, 0.18, 0.07);
  };
  const firstTouch = () => {
    if (!soundOn) return;
    if (!ac) startAudio(); else if (ac.state === 'suspended') ac.resume().catch(() => {});
  };
  document.addEventListener('pointerdown', firstTouch, true);
  document.addEventListener('keydown', firstTouch, true);
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn; syncSound();
    try { localStorage.setItem('koi-sound', soundOn ? 'on' : 'off'); } catch (e) {}
    if (soundOn) { if (!ac) startAudio(); else { ac.resume().catch(() => {}); master.gain.setTargetAtTime(0.5, ac.currentTime, 0.4); scheduleDrip(); } }
    else if (ac) { master.gain.setTargetAtTime(0, ac.currentTime, 0.15); clearTimeout(dripTimer); setTimeout(() => { if (!soundOn) ac.suspend().catch(() => {}); }, 600); }
  });
  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    if (document.hidden) ac.suspend().catch(() => {});
    else if (soundOn) ac.resume().catch(() => {});
  });
  updateUI();
  let rzT = 0;
  addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { resize(); initAmbient(); }, 120); });
  addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  let last = performance.now(), uiT = 0, saveT = 0, pushT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = now / 1000;

    if (pointer) {
      pointer.held += dt;
      if (pointer.held > 0.18) { pourTimer += dt; while (pourTimer > 0.07) { pourTimer -= 0.07; pour(pointer.x, pointer.y); } }
    }
    if (btnHold && now - btnHold.start > 250) {
      btnHold.acc += dt;
      while (btnHold.acc > 0.06) {
        btnHold.acc -= 0.06;
        btnHold.ang += 0.35;
        const rr = Math.min(W, H) * (0.18 + 0.1 * Math.sin(btnHold.ang * 0.7));
        pour(W * 0.45 + Math.cos(btnHold.ang) * rr, H * 0.5 + Math.sin(btnHold.ang) * rr * 0.75);
      }
    }

    if (water) water.draw(t);
    ctx.clearRect(0, 0, W, H);
    for (const k of koi) updateKoi(k, dt, t);
    const order = [...koi].sort((a, b) => a.size - b.size);
    for (const k of order) drawKoi(ctx, k, scale, true, t);
    drawPellets(dt, t);
    drawWeeds(dt, t);
    drawRipples(dt);
    drawGlints(dt, t);
    drawFloaters(dt, t);
    drawTags(t);

    uiT += dt; saveT += dt;
    if (uiDirty ? uiT > 0.2 : uiT > 1) { updateUI(); uiDirty = false; uiT = 0; }
    if (saveDirty && saveT > 2) { save(); saveDirty = false; saveT = 0; }
    pushT += dt;
    if (pushT > 2.5) { pushT = 0; pushMine(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(() => { if (!hinted) $('hint').style.opacity = '1'; }, 500);
  setTimeout(hideHint, 4200);
})();
</script>

</body>
</html>
